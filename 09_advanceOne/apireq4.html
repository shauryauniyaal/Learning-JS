<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request 04</title>
</head>
<body style="background-color: #212122; color: antiquewhite;">
    
</body>
<script>
    async function getData() {
        try {
            const response = await fetch('https://randomuser.me/api')
            const data = await response.json()
            let body = document.querySelector('body')
            body.innerHTML = `<h2>${data.results[0].name.first} ${data.results[0].name.last}</h2>
            <h4>${data.results[0].location.street.number}, ${data.results[0].location.street.name}, ${data.results[0].location.city}, ${data.results[0].location.state} - ${data.results[0].location.postcode}, ${data.results[0].location.country}</h4>`
        } catch (error) {
            console.log(error);
            
        }
        
    }

    getData()
</script>
</html>
